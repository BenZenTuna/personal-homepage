<!doctype html>
<html lang="en">
<head>
<script src="demo/fixtures.js"></script>
<script src="demo/server.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14120f">
<title>Kitchen wall — demo</title>
<meta name="description" content="A demo of a home-made kitchen wall dashboard, with a made-up household.">
<!-- A phone gets a layout of its own: one column, the views along the bottom.
     Marked here, before a single stylesheet has loaded, so a phone never
     paints the wall's layout first; every rule in phone.css starts with
     html.phone, so nothing else is touched by it. The wall and every laptop
     are wider than this and never match. A screen that crosses the line (a
     window dragged narrow, a phone turned) loads again as the other one. -->
<script>
  (function () {
    var q = matchMedia('(max-width: 700px), (max-height: 500px) and (pointer: coarse)');
    if (q.matches) document.documentElement.classList.add('phone');
    q.addEventListener('change', function () { location.reload(); });
  })();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
<!-- The one piece of code that does not depend on anything else loading. This
     page can arrive while its stylesheets and modules cannot (the wall' Wi-Fi
     drops for a few seconds just after a resume), and then no module ever
     runs to notice or retry: the wall stayed on a dead page for hours. If the
     dashboard has not finished starting 30 s after this page arrived, load it
     again — waiting twice as long each time it has to, up to five minutes, so
     a deploy that cannot start is not reloaded every thirty seconds all night.
     And only once the server has said {"ok": true} twice in a row (asked
     every five seconds): the wall opens kitchen.home through the workstation's nginx,
     and a reload while the kitchen is away is nginx's page, which has none of
     this on it and never tries again (sse.js's reloadWhenReachable() is the
     same rule for the modules, which cannot be imported here).
     Before the stylesheets on purpose: an inline script placed after a
     stylesheet waits for that stylesheet. app.js sets the flag at the end of
     boot(). Never write the build marker in here: index() replaces it
     everywhere in this file, comments and scripts included. -->
<script>
  (function () {
    var KEY = 'kitchen-boot-tries', tries = 0, good = 0;
    try { tries = +sessionStorage.getItem(KEY) || 0; } catch (e) {}
    function ask() {
      if (window.kitchenBooted) {
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        return;
      }
      var abort = new AbortController();
      var timer = setTimeout(function () { abort.abort(); }, 3000);
      fetch('/api/health', { cache: 'no-store', signal: abort.signal })
        .then(function (r) { return r.ok && r.json(); })
        .then(function (j) { return !!j && j.ok === true; }, function () { return false; })
        .then(function (ok) {
          clearTimeout(timer);
          good = ok ? good + 1 : 0;
          if (good < 2) return setTimeout(ask, 5000);
          if (window.kitchenBooted) return ask();   // it started meanwhile
          try { sessionStorage.setItem(KEY, tries + 1); } catch (e) {}
          location.reload();
        });
    }
    setTimeout(ask, Math.min(30000 * Math.pow(2, tries), 300000));
  })();
</script>
<!-- The build marker below is replaced with the current build id when the
     server renders this page, so a deploy is never half-applied from a
     browser cache. See index() in backend/app/main.py. -->
<link rel="stylesheet" href="fonts/fonts.css?demo">
<link rel="stylesheet" href="css/app.css?demo">
<link rel="stylesheet" href="css/phone.css?demo">
</head>
<body>

<header id="topbar">
  <div class="hd-clock">
    <div id="time">--:--</div>
    <div id="date"></div>
  </div>

  <div class="hd-rule"></div>

  <div class="hd-now">
    <div id="now-icon"></div>
    <div class="hd-now-txt">
      <div id="now-temp">--°</div>
      <div id="now-cond"></div>
      <div class="hd-now-sub">
        <span id="now-rain"></span><span id="now-city"></span><span id="now-stale"></span>
      </div>
    </div>
  </div>

  <div class="hd-rule"></div>

  <!-- What the bird box has seen, where the hourly weather band used to be.
       The hours are still one tap away, behind the reading to the left of
       this; nothing else on the wall answers "has anything been at the box
       today" without leaving the view you are on. Filled by motionbar.js. -->
  <div id="hd-motion" role="button" tabindex="0"
       aria-label="what the bird box has seen"></div>

  <!-- What the rooms are, beside what the sky is. The bird box gave up some
       of its width for it: that card is the only one in this bar that was
       ever elastic, and three of its thumbnails were three pictures of the
       same empty hallway. Filled by climate.js, which also owns the chart
       this opens. -->
  <div id="hd-climate"></div>

  <!-- Needs attention: here only while something in the house is waiting for a
       person (a flat battery, a lamp not answering, a backup missed). It takes
       its width from the bird box and nothing else, so the views never move.
       Filled by attention.js, which also owns the sheet it opens. -->
  <div id="hd-attn" hidden></div>

  <div class="hd-rule"></div>

  <!-- The views, and under them the box for notes to the kitchen agent
       (notes.js, 2026-10-19): one column, moved as one into a full-screen
       panel's header and back. -->
  <div id="views-col">
    <nav id="presets" aria-label="layout presets"></nav>
    <div id="qnote"></div>
  </div>

  <!-- The corner right of the views. It is the same width in every view —
       here it holds the tools and Live, and a panel filling the screen puts
       its ⤢ in the same room — which is what keeps the six views at one place
       on the glass. The tools act on the view you are looking at, so they sit
       against the buttons that choose it. Live is not one of them — it is a
       state, not a control — so it sits beside the block. -->
  <div class="hd-right">
    <div class="hd-tools">
      <button id="layout-btn" class="gear" title="settings: this view's arrangement and the wall's"
              aria-label="settings">⚙</button>
      <button id="dim-btn" title="dim the screen now — the clock of Screen dimming, until a tap"
              aria-label="dim the screen">🌙</button>
      <button id="ask-btn" title="ask the kitchen — tap, say it, hear the answer"
              aria-label="ask the kitchen">🎤</button>
      <button id="full-btn" title="full screen" aria-label="full screen">⛶</button>
    </div>

    <div class="hd-live">
      <span id="conn-dot"></span><span id="conn-text">Live</span>
    </div>
  </div>
</header>


<!-- Arrangements of the current view. Built by app.js; each option carries a
     scale drawing of the layout it applies, because the words for "photos get
     the whole width" are longer than the picture and less certain. -->
<!-- The ⚙ Settings window: a .sheet of the settings window kit (app.css). -->
<div id="layout-overlay" class="sheet" role="dialog" aria-labelledby="lay-title" hidden>
  <header>
    <span class="sheet-icon" aria-hidden="true">⚙</span>
    <div class="sheet-title">
      <h2 id="lay-title">Arrange</h2>
      <span class="sheet-status" id="lay-sub"></span>
    </div>
    <span class="spacer"></span>
    <!-- How each alert shows (Needs attention's own ⚙), reachable here too:
         that window only opens from its chip, and with nothing to say there
         is no chip. -->
    <button id="lay-alerts" class="ls-btn" hidden>🔔 How alerts show</button>
    <button id="lay-close" class="ls-close">Close</button>
  </header>
  <div id="lay-options" class="ls-body"></div>
</div>

<main id="grid"></main>

<script type="module" src="js/app.js?demo"></script>
</body>
</html>
